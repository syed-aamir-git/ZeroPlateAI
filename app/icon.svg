<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Emerald Gradient for Environmental Food Rescue -->
    <linearGradient id="zp-emerald-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Warm Amber/Saffron Gradient for Nourishing Meals -->
    <linearGradient id="zp-amber-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Porcelain Plate Surface Gradient -->
    <radialGradient id="zp-porcelain-base" cx="48%" cy="46%" r="50%" fx="40%" fy="35%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
  </defs>

  <!-- Outer Circular Dish (Zero Waste Round Plate) -->
  <circle cx="50" cy="50" r="46" fill="url(#zp-porcelain-base)" stroke="#CBD5E1" stroke-width="2" />

  <!-- Subtle Inner Plate Well Inset -->
  <circle cx="50" cy="50" r="36" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5" />

  <!-- 1. Circular Redistribution Arc: Emerald Fresh Food Stream (Top/Left) -->
  <path d="M 22 50 C 22 34.5 34.5 22 50 22 C 60.5 22 69.8 27.8 74.8 36.5" stroke="url(#zp-emerald-flow)" stroke-width="6" stroke-linecap="round" />
  <!-- Emerald Stream Arrowhead -->
  <path d="M 72 30 L 77.5 38 L 68.5 39 Z" fill="#059669" />

  <!-- 2. Circular Redistribution Arc: Golden Amber Meal Delivery Stream (Bottom/Right) -->
  <path d="M 78 50 C 78 65.5 65.5 78 50 78 C 39.5 78 30.2 72.2 25.2 63.5" stroke="url(#zp-amber-glow)" stroke-width="6" stroke-linecap="round" />
  <!-- Golden Stream Arrowhead -->
  <path d="M 28 70 L 22.5 62 L 31.5 61 Z" fill="#D97706" />

  <!-- Center Fork -->
  <path d="M 43 65 L 43 47" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  <path d="M 38 47 C 38 51 48 51 48 47 L 48 36" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M 38 36 L 38 47 M 43 36 L 43 47" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />

  <!-- Fresh Sprouting Leaf -->
  <path d="M 45 62 C 48 58 59 55 61 41 C 51 40 47 49 46 57 Z" fill="url(#zp-emerald-flow)" />
  <path d="M 46 60 C 48 54 53 48 59 43" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Warm Golden Grain / Nourishment Drop -->
  <circle cx="50" cy="30" r="3.5" fill="url(#zp-amber-glow)" />
</svg>
